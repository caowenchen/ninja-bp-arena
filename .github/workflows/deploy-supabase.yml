name: Deploy Supabase Backend

# Supabase 后端部署（migration + Edge Functions）与 GitHub Pages 是两条独立流水线。
# 仅手动触发（workflow_dispatch），需要配置仓库 Secrets：
#   SUPABASE_ACCESS_TOKEN   —— Supabase CLI 访问令牌（绝不能带 VITE_ 前缀进前端）
#   SUPABASE_PROJECT_ID     —— 项目 ref

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

      - name: Apply database migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy Edge Functions
        run: |
          supabase functions deploy room-create
          supabase functions deploy room-join
          supabase functions deploy room-command
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
